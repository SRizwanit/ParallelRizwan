name: Android Build

# Builds a debug APK and publishes it to GitHub Releases. No secrets are needed.

on:
  workflow_dispatch:

env:
  APP_NAME: Parallel
  NDK_VERSION: '29.0.13846066'   # keep in sync with ext.ndkVer in build.gradle

concurrency:
  group: debug-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Generate and Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # The BlackBox engine (Bcore) is compiled with Java 21.
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # The engine has native code (ndkBuild) and needs this exact NDK.
      - name: Install NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;${NDK_VERSION}"

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Verify APK
        id: verify
        run: |
          ls -lh app/build/outputs/apk/debug/app-debug.apk
          echo "sha256=$(sha256sum app/build/outputs/apk/debug/app-debug.apk | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/debug/app-debug.apk
          tag_name: build-${{ github.run_number }}
          name: ${{ env.APP_NAME }} v${{ github.run_number }} (Debug)
          body: |
            Debug Android APK.

            Build: #${{ github.run_number }}
            Commit: `${{ github.sha }}`
            SHA-256: `${{ steps.verify.outputs.sha256 }}`

            Download: app-debug.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
