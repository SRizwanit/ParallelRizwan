plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.srizwan.parallel'
    compileSdk rootProject.ext.compileSdkVersion
    ndkVersion rootProject.ext.ndkVer

    defaultConfig {
        applicationId 'com.srizwan.parallel'
        minSdk rootProject.ext.minSdk
        targetSdk rootProject.ext.targetSdkVersion
        versionCode 1
        versionName '1.0.0'
    }

    buildTypes {
        release {
            // The engine is reflection/native heavy: shrinking is switched off on purpose.
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    kotlinOptions {
        jvmTarget = '21'
    }

    packaging {
        // BlackBox needs the native libs extracted to disk
        jniLibs {
            useLegacyPackaging true
        }
    }
}

dependencies {
    implementation project(':Bcore')
}
